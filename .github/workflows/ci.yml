name: Data Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e . pydantic duckdb pyarrow requests dbt-duckdb prefect pytest ruff

      - name: Run code formatting and linting
        run: ruff check .

      - name: Run Python unit tests (Pydantic Contracts)
        run: pytest -v

      - name: Run E2E Integration - Ingest Bronze Data
        run: python -m src.ingestion.world_bank

      - name: Run E2E Integration - dbt Build
        run: dbt build --project-dir dbt --profiles-dir dbt