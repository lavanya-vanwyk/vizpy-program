[tool.poetry]
name = "internet-adoption-pipeline"
version = "0.1.0"
description = "Production ELT pipeline for global internet adoption metrics using DuckDB and dbt"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pydantic = ">=2.6.0"
duckdb = ">=0.10.0"
pyarrow = ">=15.0.0"
requests = "^2.31.0"
dbt-duckdb = ">=1.7.0"
prefect = "^3.6"


[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []